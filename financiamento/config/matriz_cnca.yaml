  # ------------------------------------------------ Bloco 3 — Financiamento
  - id: P18
    bloco: 3
    enunciado: "Quais fontes de recursos atreladas ao CNCA foram recebidas ou estão ativas na rede?"
    tipo: escolha_multipla
    opcoes: ["Repasses via PAR", "PDDE Cantinho da Leitura / Material Didático Complementar",
             "Bolsas RENALFA (Articuladores e Formadores)", "Formação Continuada de Professores",
             "Recursos do Estado via Regime de Colaboração", "Recursos Próprios do Município"]
    achados: [A3.1, A4.1, A6.1]
    evidencia: parcial
    responde_com: >-
      Quatro das seis opções são verificáveis. PDDE: direto, por escola (CGU, PO 000C). Recursos
      do Estado: quase direto, pelo SIGEFES (UG do FUNPAES + modalidade 40/41/42 + favorecido =
      fundo municipal). PAR: só proxy, pela fonte 569. Recursos próprios: proxy, pelas fontes
      500/540 na subfunção 361. Bolsas Renalfa: INDISPONÍVEL.
    dados_pessoais: false
  - id: P19
    bloco: 3
    enunciado: "Caso tenha ocorrido complementação com recurso próprio, qual percentual aplicado?"
    tipo: escolha_unica
    opcoes: ["Até 20%", "21 a 40%", "41 a 60%", "61 a 80%", "acima de 80%"]
    achados: [A6.1]
    evidencia: proxy
    responde_com: >-
      A proporção de fonte 500/540 na subfunção 361 dá a ordem de grandeza do custeio próprio,
      mas não isola complementação ao CNCA de manutenção ordinária da rede.
    dados_pessoais: false
  - id: P20
    bloco: 3
    enunciado: "Caso tenha utilizado recursos próprios, qual foi o principal motivo da complementação?"
    tipo: escolha_unica
    opcoes: ["Recursos insuficientes", "Atraso na disponibilização/repasse", "Dificuldade de contratação",
             "Dificuldade de aquisição", "Dificuldade de planejamento", "Falta de equipe",
             "Dúvidas sobre a utilização", "Problemas administrativos", "Outro"]
    achados: [A6.1]
    evidencia: indisponivel
    responde_com: >-
      Motivo é declaração. O painel pode CONTRASTAR "atraso na disponibilização" com a defasagem
      medida em A4.2 (só 2024-2025), mas não responde a pergunta.
    dados_pessoais: false
  - id: P21
    bloco: 3
    enunciado: >-
      Qual percentual das escolas da rede municipal foi beneficiado com recursos do PDDE
      relacionados às ações do CNCA?
    tipo: escolha_unica
    opcoes: ["até 20%", "21 a 40%", "41 a 60%", "61 a 80%", "acima de 80%"]
    achados: [A2.2]
    evidencia: direta
    responde_com: >-
      Unidades executoras que receberam PDDE no plano orçamentário 000C, ligadas à escola do
      Censo, ÷ escolas municipais com anos iniciais. Calculável para os 78 municípios.
    dados_pessoais: false
  - id: P22
    bloco: 3
    enunciado: "O município possui mecanismo de segregação e acompanhamento dos recursos relacionados ao CNCA?"
    tipo: escolha_unica
    opcoes: ["Sim, conta específica para todas as verbas", "Sim, por centro de custos/classificação contábil",
             "Parcialmente (só verbas diretas do FNDE/PDDE)", "Não"]
    achados: [A4.5]
    evidencia: proxy
    responde_com: >-
      A resposta "sim, por classificação contábil" é CONTRADITA pelos dados: não existe fonte,
      complemento, programa ou ação que identifique o CNCA em nenhum dos 78 municípios. Esse
      contraste é, em si, a evidência mais forte deste painel para Q4.
    dados_pessoais: false
  - id: P23
    bloco: 3
    enunciado: "O município realiza acompanhamento periódico da execução dos recursos relacionados ao CNCA?"
    tipo: escolha_unica
    opcoes: ["Quinzenal", "Mensal", "Bimestral", "Trimestral", "Eventual", "Não existe"]
    achados: [A5.1, A5.3]
    evidencia: indisponivel
    responde_com: "Periodicidade de rotina interna não deixa rastro público."
    dados_pessoais: false
  - id: P24
    bloco: 3
    enunciado: >-
      Quais indicadores de acompanhamento da execução financeira é/são utilizado especificamente
      para recursos provenientes do CNCA?
    tipo: escolha_multipla
    opcoes: ["Índice de execução orçamentária (Empenhado ÷ Dotação atualizada × 100)",
             "Índice de execução financeira (Pago ÷ Dotação atualizada × 100)",
             "Índice de liquidação (Liquidado ÷ Empenhado × 100)",
             "Índice de pagamento (Pago ÷ Liquidado × 100)",
             "Não utiliza indicadores"]
    achados: [A5.1, A5.2]
    evidencia: direta
    responde_com: >-
      Os quatro índices são calculados pelo painel para todo município-ano, por fonte e por ação
      — mas não "especificamente para recursos do CNCA", porque o CNCA não é isolável. Servem
      para confrontar a resposta, não para classificar o achado.
    dados_pessoais: false
  - id: P25
    bloco: 3
    enunciado: "Existem valores empenhados e liquidados (Restos a Pagar Processados) há períodos prolongados?"
    tipo: escolha_unica
    opcoes: ["Sim", "Não", "Não sabe informar"]
    achados: [A4.1]
    evidencia: direta
    responde_com: >-
      As 13 colunas de restos a pagar do empenho do TCE-ES (RPPExercicio, RPPTransferido,
      RPPPago, RPPCancelado…) dão o estoque e a idade, por fonte, em todos os exercícios.
    dados_pessoais: false
  - id: P26
    bloco: 3
    enunciado: "Existem restos a pagar processados relevantes relacionados às ações do CNCA?"
    tipo: escolha_unica
    opcoes: ["Sim", "Não", "Não sabe informar"]
    achados: [A4.1]
    evidencia: proxy
    responde_com: >-
      Medível sobre as fontes 551 e 569, não sobre o CNCA. "Relevante" usa
      parametros.rp_relevante_pct sobre o empenhado do ano.
    dados_pessoais: false
  - id: P27
    bloco: 3
    enunciado: "O município consegue estimar os recursos necessários para executar as ações previstas do CNCA?"
    tipo: escolha_unica
    opcoes: ["Sim", "Parcialmente", "Não"]
    achados: [A2.1, A2.2, A6.1]
    evidencia: proxy
    responde_com: >-
      O painel calcula o valor de referência do Cantinho da Leitura (salas × R$ 1.235) como
      ordem de grandeza — que é contraste, não resposta.
    dados_pessoais: false
  - id: P28
    bloco: 3
    enunciado: "O município incorporou as ações do CNCA ao seu planejamento orçamentário?"
    tipo: escolha_unica
    opcoes: ["Sim", "Parcialmente", "Não", "Não sabe informar"]
    achados: [A3.1]
    evidencia: proxy
    responde_com: "Mesmo indicador de P17 e A3.1: ação nomeada e dotação na fonte 569."
    dados_pessoais: false
  - id: P29
    bloco: 3
    enunciado: "Qual foi o valor dos recursos orçados e executados para as ações relacionadas ao CNCA em 2023?"
    tipo: numero_par
    achados: [A4.1]
    evidencia: proxy
    responde_com: >-
      Não há valor "do CNCA" no orçamento municipal. O painel oferece dotação e empenho na fonte
      569 e o PDDE-CNCA recebido — três números diferentes, cada um rotulado com o que mede.
      A comparação com a resposta do município é justamente o ponto de exame.
    dados_pessoais: false
  - id: P30
    bloco: 3
    enunciado: "Qual foi o valor dos recursos orçados e executados para as ações relacionadas ao CNCA em 2024?"
    tipo: numero_par
    achados: [A4.1]
    evidencia: proxy
    responde_com: "Idem P29, para 2024."
    dados_pessoais: false
  - id: P31
    bloco: 3
    enunciado: "Qual foi o valor dos recursos orçados e executados para as ações relacionadas ao CNCA em 2025?"
    tipo: numero_par
    achados: [A4.1]
    evidencia: proxy
    responde_com: "Idem P29, para 2025."
    dados_pessoais: false
  - id: P32
    bloco: 3
    enunciado: "Qual foi o valor dos recursos orçados e executados para as ações relacionadas ao CNCA em 2026?"
    tipo: numero_par
    achados: [A4.1]
    evidencia: indisponivel
    responde_com: >-
      2026 está fora da janela do painel: o arquivo de empenhos de 2026 no TCE-ES tem só as duas
      primeiras partes publicadas (as partes 3 a 5 vêm vazias, 572 bytes).
    dados_pessoais: false
  - id: P33
    bloco: 3
    enunciado: >-
      Existe um sistema ou mecanismo de gestão financeira que permite filtrar, em tempo real, as
      despesas relacionadas às ações de alfabetização (1º e 2º anos)?
    tipo: escolha_unica
    opcoes: ["Sim, o sistema contábil gera relatórios individualizados",
             "Parcialmente, consolidação manual no fim do exercício",
             "Não, as despesas do 1º e 2º ano são agregadas ao Ensino Fundamental"]
    achados: [A4.5, A5.1]
    evidencia: direta
    responde_com: >-
      A resposta é DIRETA e vale para os 78: a despesa do 1º e 2º ano NÃO é separável na remessa
      ao TCE-ES. A subfunção 361 é o menor grão que existe, e ela cobre o ensino fundamental
      inteiro. Município que responder "sim" está descrevendo um sistema interno que não chega
      ao CidadES.
    dados_pessoais: false
  - id: P34
    bloco: 3
    enunciado: "Como é feito o controle do pagamento das Bolsas RENALFA (articuladores locais/municipais e formadores)?"
    tipo: escolha_unica
