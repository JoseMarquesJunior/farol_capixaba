    dados_pessoais: true
  - id: P6
    bloco: 1
    enunciado: >-
      Qual(ais) área/setor(es) da Secretaria Municipal de Educação/Prefeitura participou do
      preenchimento das informações relativas ao financiamento e à execução dos recursos do CNCA?
    tipo: escolha_multipla
    opcoes: ["Planejamento", "Financeiro/Contabilidade", "Gestão da Educação",
             "Coordenação do CNCA/Alfabetização", "Pedagógico", "Outro"]
    achados: []
    evidencia: indisponivel
    responde_com: "Só o questionário responde."
    dados_pessoais: false

  # ------------------------------------- Bloco 2 — Governança e planejamento
  - id: P7
