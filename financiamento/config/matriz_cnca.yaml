  - id: P2
    bloco: 1
    enunciado: "Nome do respondente"
    tipo: texto
    achados: []
    evidencia: indisponivel
    responde_com: "Dado pessoal do respondente. Fora do escopo do painel."
    dados_pessoais: true
  - id: P3
    bloco: 1
    enunciado: "Cargo/função do respondente"
    tipo: texto
    achados: []
    evidencia: indisponivel
    responde_com: "Só o questionário responde."
    dados_pessoais: true
  - id: P4
    bloco: 1
    enunciado: "E-mail para contato"
    tipo: email
    achados: []
    evidencia: indisponivel
    responde_com: "Dado pessoal. Nunca exibir."
    dados_pessoais: true
  - id: P5
    bloco: 1
    enunciado: "Tempo de atuação na função"
    tipo: texto
    achados: []
    evidencia: indisponivel
    responde_com: >-
      O dado de pessoal do TCE-ES traz vínculo e cargo, mas sem lotação e sem ligação com a
