nivel3:
  # Nível 3 — ONDE cada valor foi aplicado no detalhe (qual obra, qual fornecedor,
  # qual escola). Não existe fonte nacional padronizada e automatizável para isso:
  # o painel NÃO simula este nível com dados agregados. Ele aponta, por município,
  # o portal da transparência (heterogêneo, sem padrão de dados) e, como próximo
  # passo, os sistemas internos do TCE-ES de despesa por empenho/credor.
  #
  # Registre só link CONFERIDO (abriu e é o portal oficial do município):
  #   - {cod_ibge: <7 dígitos>, url: "https://...", verificado_em: AAAA-MM-DD}
  # `url: null` = ainda não cadastrado (o painel diz isso, sem inventar endereço).
  #
  # `api:` é a documentação da API do portal, quando o município publica uma. O
  # pipeline NÃO a consulta: é um ponteiro para quem for buscar à mão o que o dado
  # aberto do TCE-ES não traz (item de nota fiscal, lotação do servidor). Registrar
  # `api` também exige `verificado_em`.
