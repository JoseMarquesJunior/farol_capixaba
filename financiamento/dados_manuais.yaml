# ---------------------------------------------------------------------------
# Dados MANUAIS — tudo que não vem de API.
#
# Regras (o ETL as aplica e PARA se alguma for violada):
#   * todo registro com valor ou situação exige `fonte` e `verificado_em`
#     (AAAA-MM-DD, a data em que VOCÊ consultou a fonte);
#   * `valor: null` sem situação = marcador "ainda não consultado". Aparece no
#     dashboard como "sem dado carregado" — nunca como zero;
#   * campos em série (articuladores_bolsa, MDE) exigem `ano`;
#   * cod_ibge precisa ser um dos 78 municípios do ES.
#
# Nada aqui foi preenchido pelo pipeline: os valores são da fonte, digitados por
# quem consultou. Os campos e valores aceitos estão em programas.yaml.
# ---------------------------------------------------------------------------
esquema: 1

financiamento_geral:
  # Percentual aplicado em MDE sobre a receita de impostos e transferências
  # (art. 212 da CF; mínimo 25%). O SICONFI não publica o Anexo 08 por API, então
  # o dado legal vem do SIOPE (consulta manual) ou do RREO Anexo 08 em PDF.
  # Registrar UM item por município e ano:
  #   - {cod_ibge: <7 dígitos>, ano: <AAAA>, valor: <percentual 0-100>,
  #      fonte: "<onde consultou>", verificado_em: <AAAA-MM-DD>}
  mde_aplicado_pct: []

